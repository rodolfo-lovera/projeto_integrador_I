{% extends 'base.html' %}

{% block content %}
<h2>Cadastro de Produto</h2>

<form method="POST" action="/cadastro">

    <label>Código SKU:</label><br>
    <input type="text" name="sku" required><br><br>

    <label>Descrição (Ex: Leite Integral):</label><br>
    <input type="text" name="descricao" required><br><br>

    <label>Categoria:</label><br>
    <select name="categoria_id" required>
        <option value="">Selecione...</option>
        {% for cat in categorias %}
        <option value="{{ cat['id'] }}">{{ cat['nome'] }}</option>
        {% endfor %}
    </select><br><br>

    <label>Fornecedor:</label><br>
    <select name="fornecedor_id" required>
        <option value="">Selecione...</option>
        {% for forn in fornecedores %}
        <option value="{{ forn['id'] }}">{{ forn['nome'] }}</option>
        {% endfor %}
    </select><br><br>

    <label>Unidade de Medida:</label><br>
    <select name="unidade_medida" required>
        <option value="Kg">Kg</option>
        <option value="Litros">Litros</option>
        <option value="unidades">Unidades</option>
        <option value="Caixa">Caixa</option>
    </select><br><br>

    <label>Estoque Mínimo para Alerta:</label><br>
    <input type="number" step="0.1" name="estoque_minimo" required><br><br>

    <button type="submit">Salvar Produto</button>
</form>
{% endblock %}
